name: NaviMind Agent Bridge

on:
  push:
    branches:
      - feature/universal-agent-bridge
  pull_request:
    branches:
      - main

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify shared fixtures against the pinned Windows executor commit
        run: node scripts/check-browser-fixture-sync.cjs --remote

      - name: Browser evaluation script preflight
        run: node scripts/check-browser-eval-names.cjs

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      - name: Workspace and agent regression contracts
        run: node --test tests/*.test.cjs

      - name: Checkout pinned offer executor
        uses: actions/checkout@v4
        with:
          repository: wisnialeszno89/wh-ai-parser
          ref: a7b913bcaed8dc2ab9bdf6ba365c6aeac4514154
          path: .executor-contract

      - name: Setup Python for shared offer boundary
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install offer schema validator
        run: python -m pip install jsonschema==4.26.0

      - name: Verify text and PDF exports in the actual executor adapter
        run: node scripts/check-offer-executor-boundary.cjs

      - name: Build the production workspace UI
        run: pnpm build
        env:
          OPENAI_API_KEY: ui-fixture-not-a-credential

      - name: Install browser for UI checks
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Verify enquiry and PDF specification downloads in Chromium
        run: python scripts/check-workspace-offer-ui.py
