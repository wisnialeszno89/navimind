name: Tavily Smoke Test

on:
  push:
    branches:
      - test/tavily-smoke-20261002

permissions:
  contents: read

jobs:
  tavily-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Call NaviMind research bridge
        env:
          NAVIMIND_URL: https://navimind.vercel.app/api/agent/task
        run: |
          cat > payload.json <<'JSON'
          {
            "version": "1",
            "task_id": "tavily-smoke-20261002",
            "goal": "Sprawdź w internecie aktualne informacje o najnowszym modelu OpenAI i zwróć jedną odpowiedź opartą na świeżym źródle.",
            "intent": "validate_external_research",
            "session_id": null,
            "user_id": null,
            "capability": null,
            "skill": null,
            "world": {
              "active_application": "smoke_test",
              "active_window_title": "Tavily Smoke Test",
              "visible_elements": [],
              "element_count": 0
            },
            "offer_workflow": null,
            "knowledge": {
              "version": "1",
              "local": null,
              "external": null
            },
            "experience": [],
            "constraints": {
              "semantic_only": true,
              "max_actions": 1,
              "verify_each_action": true,
              "research_enabled": true,
              "research_depth": "basic",
              "research_max_results": 3,
              "research_topic": "general"
            },
            "metadata": {
              "test": "tavily_smoke"
            }
          }
          JSON

          curl --fail-with-body -sS \
            -H "Content-Type: application/json" \
            --data @payload.json \
            "$NAVIMIND_URL" > response.json

          node - <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("response.json", "utf8"));
          console.log("status=", data.status ?? null);
          console.log("requires_manual_review=", data.requires_manual_review ?? null);
          console.log("external_knowledge_status=", data.metadata?.external_knowledge_status ?? null);
          console.log("external_knowledge_sources=", data.metadata?.external_knowledge_sources ?? 0);
          console.log("external_knowledge_facts=", data.metadata?.external_knowledge_facts ?? 0);
          console.log("external_knowledge_conflicts=", data.metadata?.external_knowledge_conflicts ?? 0);
          console.log("research_error=", data.metadata?.error ?? null);
          NODE
